<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Color Splash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#dff1ff; --panel:#ffffff; --ink:#1b2a4a; --soft:#5d6f93; --ring:#1b2a4a;
  --btn:#ffe066; --btn-ink:#3a2a00; --shadow:0 4px 0 rgba(27,42,74,.18);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#13203b; --panel:#1f2f52; --ink:#f3f6ff; --soft:#a9b8da; --ring:#ffffff;
    --btn:#ffd43b; --btn-ink:#2a1e00; --shadow:0 4px 0 rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#13203b; --panel:#1f2f52; --ink:#f3f6ff; --soft:#a9b8da; --ring:#ffffff;
  --btn:#ffd43b; --btn-ink:#2a1e00; --shadow:0 4px 0 rgba(0,0,0,.35);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"Baloo 2","Chalkboard SE","Comic Sans MS","Trebuchet MS",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  overflow:hidden;touch-action:manipulation;
}
.app{height:100%;display:grid;grid-template-rows:auto 1fr;gap:10px;padding:10px 14px}
header{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
h1{margin:0 auto 0 4px;font-weight:800;font-size:clamp(26px,4vw,40px);line-height:1;letter-spacing:.5px}
h1 span:nth-child(1){color:#ff4d6d}h1 span:nth-child(2){color:#ff9f1c}h1 span:nth-child(3){color:#2ec4b6}
h1 span:nth-child(4){color:#3a86ff}h1 span:nth-child(5){color:#8338ec}
.btn{
  font:inherit;font-weight:800;font-size:20px;border:0;border-radius:18px;
  background:var(--btn);color:var(--btn-ink);padding:10px 16px;min-height:56px;min-width:56px;
  box-shadow:var(--shadow);cursor:pointer;display:inline-flex;align-items:center;gap:6px;
}
.btn:active{transform:translateY(3px);box-shadow:none}
.btn:focus-visible,.swatch:focus-visible,.card:focus-visible{outline:4px solid var(--ring);outline-offset:3px}
.btn.alt{background:var(--panel);color:var(--ink)}
.btn[disabled]{opacity:.45}
.stage{min-height:0;display:grid;gap:12px;grid-template-columns:1fr auto}
.board{min-width:0;min-height:0;display:grid;place-items:center;position:relative;overflow:hidden;touch-action:none;border-radius:22px}
.zoom{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:10px;z-index:2}
.zoom .btn{min-width:64px;min-height:64px;font-size:28px;justify-content:center;padding:0}
#paper{
  background:#fff;border-radius:22px;box-shadow:0 6px 0 rgba(27,42,74,.15),0 0 0 6px var(--panel);
  touch-action:none;display:block;transform-origin:0 0;will-change:transform;
}
[hidden]{display:none!important}
.palette{
  background:var(--panel);border-radius:24px;padding:12px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:14px;overflow:auto;width:max-content;
}
.toolrow{display:flex;flex-direction:column;gap:12px;align-items:center}
.tools{display:grid;grid-template-columns:58px;gap:10px}
.colors{display:grid;grid-template-columns:repeat(6,64px);gap:14px;justify-content:center}
.colors .swatch,.colors .sticker{width:64px;height:64px}
.pick{width:58px;height:58px;border-radius:50%;border:5px solid var(--ring);cursor:pointer;padding:0;font-size:30px;background:var(--bg);box-shadow:var(--shadow)}
.toast{position:fixed;left:50%;bottom:calc(30px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);font-weight:800;font-size:22px;padding:12px 22px;border-radius:999px;z-index:30;opacity:0;transition:opacity .25s;pointer-events:none}
.toast.show{opacity:1}
.trayBox{max-width:520px;width:auto}
.trayBox h2{text-align:center}
.tool,.sticker{width:58px;height:58px;border-radius:18px;border:4px solid transparent;background:var(--bg);font-size:30px;padding:0;cursor:pointer;line-height:1}
.tool[aria-pressed="true"]{border-color:var(--ring);background:var(--btn)}
.sticker[aria-pressed="true"]{border-color:var(--ring);transform:scale(1.08)}
.sizes{display:flex;flex-direction:column;gap:10px}
.size{width:58px;height:50px;border-radius:16px;border:4px solid transparent;background:var(--bg);display:grid;place-items:center;cursor:pointer;padding:0}
.size i{display:block;border-radius:50%;background:var(--ink)}
.size[aria-pressed="true"]{border-color:var(--ring)}
.swatch{
  width:58px;height:58px;border-radius:50%;border:4px solid rgba(0,0,0,.12);cursor:pointer;padding:0;
  transition:transform .12s;
}
.swatch[aria-pressed="true"]{border-color:var(--ring);transform:scale(1.12)}
.tool:focus-visible,.size:focus-visible,.sticker:focus-visible{outline:4px solid var(--ring);outline-offset:2px}
@media (orientation:portrait){
  .stage{grid-template-columns:1fr;grid-template-rows:1fr auto}
  .palette{width:auto}
  .palette{padding:8px 12px}
  .toolrow{flex-direction:row;flex-wrap:wrap;gap:10px 18px;justify-content:center}
  .tools{grid-template-columns:repeat(5,58px)}
  .sizes{flex-direction:row}
}
.spark{position:fixed;width:16px;height:16px;border-radius:50%;pointer-events:none;
  animation:fly .6s ease-out forwards;border:2px solid #fff}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
@media (prefers-reduced-motion:reduce){.spark{display:none}.swatch{transition:none}}
.overlay{position:fixed;inset:0;background:rgba(10,20,40,.55);display:none;place-items:center;z-index:20;padding:20px}
.overlay.open{display:grid}
.sheet{background:var(--panel);color:var(--ink);border-radius:28px;padding:22px;max-width:900px;width:100%;max-height:90%;overflow:auto}
.sheet h2{margin:0 0 14px;font-size:30px;font-weight:800}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.sheet h3{margin:22px 0 12px;font-size:26px;font-weight:800}
.sheet h3:first-child{margin-top:0}
.card{background:var(--bg);border:0;border-radius:20px;padding:10px;cursor:pointer;font:inherit;color:var(--ink);font-weight:800;font-size:20px}
.card canvas{width:100%;aspect-ratio:1;background:#fff;border-radius:14px;display:block;margin-bottom:6px}
.card.current{outline:5px solid #3a86ff}
.ask{max-width:460px;text-align:center}
.ask p{font-size:22px;margin:0 0 18px}
.row{display:flex;gap:12px;justify-content:center}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1 aria-label="Color Splash"><span>Color</span> <span>S</span><span>pl</span><span>as</span><span>h</span></h1>
    <button class="btn" id="pics">🖼️ Pictures</button>
    <button class="btn alt" id="undo" disabled aria-label="Undo">↩️ Undo</button>
    <button class="btn alt" id="clear" aria-label="Start over">🗑️ Start over</button>
    <button class="btn" id="savePic" hidden>📷 Save picture</button>
    <button class="btn alt" id="sound" aria-label="Sound on">🔊</button>
  </header>
  <div class="stage">
    <div class="board" id="board"><canvas id="paper" width="1024" height="1024" aria-label="Coloring picture. Tap a space to fill it with color. Pinch to zoom."></canvas>
      <div class="zoom"><button class="btn alt" id="zin" aria-label="Zoom in">🔍</button><button class="btn alt" id="zout" aria-label="Zoom out" disabled>➖</button></div>
    </div>
    <div class="palette" id="palette">
      <div class="toolrow"><div class="tools" id="tools"></div><button class="pick" id="pick" aria-label="Choose a color"></button><div class="sizes" id="sizes"></div></div>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

<div class="overlay" id="picker"><div class="sheet">
  <h2>Pick a picture</h2>
  <div id="cards"></div>
</div></div>

<div class="overlay" id="tray"><div class="sheet trayBox">
  <h2 id="trayTitle">Pick a color</h2>
  <div class="colors" id="colors"></div>
  <div class="colors" id="stickers" hidden></div>
</div></div>

<div class="overlay" id="confirm"><div class="sheet ask">
  <h2>Start over?</h2>
  <p>This wipes all the colors off this picture.</p>
  <div class="row"><button class="btn alt" id="no">Keep it</button><button class="btn" id="yes">Start over</button></div>
</div></div>

function drawLines(ctx, sheet, scale){
  ctx.save(); ctx.scale(scale, scale);
  ctx.lineWidth = 10; ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.strokeStyle = '#1d1d24';

}

  for (const s of list){ ctx.font = `${Math.round(s.size*scale)}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`; ctx.fillText(s.e, s.x*scale, s.y*scale); }
  ctx.restore();
}
function renderLive(){ pctx.clearRect(0,0,N,N); pctx.drawImage(colorC,0,0); pctx.drawImage(lineC,0,0); drawStickers(pctx, stickers, S); }
function render(){ cctx.putImageData(colorImg,0,0); renderLive(); }
function loadStickers(id){ try{ return JSON.parse(load('stk:'+id)||'[]'); }catch(e){ return []; } }

function openSheet(s){
  sheet = s; undoStack = []; updateUndo(); z = 1; clampView();
  lctx.clearRect(0,0,N,N); drawLines(lctx, s, S);
  const a = lctx.getImageData(0,0,N,N).data;
  for (let i=0;i<N*N;i++) wall[i] = a[i*4+3] >= 90 ? 1 : 0;
  col32.fill(WHITE); stickers = loadStickers(s.id); render();
  store('last', s.id);

    img.src = saved;
  }
}

/* ---------- bucket fill ---------- */
function bucket(px, py, c32){
  let start = py*N + px;
  if (wall[start]){ // tapped right on a line: find the closest open spot
    let found = -1;
    for (let r=1; r<=14 && found<0; r++)
      for (let dy=-r; dy<=r && found<0; dy++)
        for (let dx=-r; dx<=r; dx++){
          const x=px+dx, y=py+dy; if (x<0||y<0||x>=N||y>=N) continue;
          const j=y*N+x; if (!wall[j]){ found=j; break; }
        }
    if (found<0) return false; start = found;
  }
  if (col32[start] === c32) return false;
  seen.fill(0);
  let sp=0, n=0; stack[sp++]=start; seen[start]=1;
  while (sp){
    const i = stack[--sp]; changed[n++] = i; const x = i % N;
    if (x>0){const j=i-1; if(!seen[j]&&!wall[j]){seen[j]=1;stack[sp++]=j;}}
    if (x<N-1){const j=i+1; if(!seen[j]&&!wall[j]){seen[j]=1;stack[sp++]=j;}}
    if (i>=N){const j=i-N; if(!seen[j]&&!wall[j]){seen[j]=1;stack[sp++]=j;}}
    if (i<N*N-N){const j=i+N; if(!seen[j]&&!wall[j]){seen[j]=1;stack[sp++]=j;}}
  }
  // tuck color under the edge of the lines so no white halo shows
  const regionEnd = n;
  for (let k=0;k<regionEnd && n<changed.length-100;k++){
    const i = changed[k], x=i%N;
    if (!((x>0&&wall[i-1])||(x<N-1&&wall[i+1])||(i>=N&&wall[i-N])||(i<N*N-N&&wall[i+N]))) continue;
    const y=(i/N)|0;
    for (let dy=-4;dy<=4;dy++) for (let dx=-4;dx<=4;dx++){
      const xx=x+dx, yy=y+dy; if(xx<0||yy<0||xx>=N||yy>=N) continue;
      const j=yy*N+xx; if (wall[j] && seen[j]!==2){ seen[j]=2; changed[n++]=j; }
    }
  }
  const idx = changed.slice(0,n), old = new Uint32Array(n);
  if (c32 === 'rainbow'){ // stripes of rainbow from top to bottom of the space
    let y0=N, y1=0; for (let k=0;k<regionEnd;k++){ const y=(idx[k]/N)|0; if(y<y0)y0=y; if(y>y1)y1=y; }
    const span=Math.max(1,y1-y0);
    for (let k=0;k<n;k++){ const y=(idx[k]/N)|0; old[k]=col32[idx[k]]; col32[idx[k]]=RAINBOW_LUT[Math.max(0,Math.min(299,Math.round((y-y0)/span*300)))]; }
  } else for (let k=0;k<n;k++){ old[k]=col32[idx[k]]; col32[idx[k]]=c32; }
  undoStack.push({t:'px', idx, old}); if (undoStack.length>25) undoStack.shift();
  return true;
}

for (let h=0;h<360;h++){ const s=.95,l=.58,a=s*Math.min(l,1-l), f=n=>{const k=(n+h/30)%12; return Math.round(255*(l-a*Math.max(-1,Math.min(k-3,9-k,1))));};
  RAINBOW_LUT[h]=((255<<24)|(f(4)<<16)|(f(8)<<8)|f(0))>>>0; }

let actx = null, soundOn = load('sound') !== 'off';
const soundBtn = document.getElementById('sound');

function blip(f=600, len=0.18){
  if (!soundOn) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    if (actx.state==='suspended') actx.resume();
    const o=actx.createOscillator(), g=actx.createGain(), t=actx.currentTime;
    o.type='sine'; o.frequency.setValueAtTime(f,t); o.frequency.exponentialRampToValueAtTime(f*1.8,t+len);
    g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(0.25,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+len);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t+len+0.02);
  }catch(e){}
}
soundBtn.onclick = () => { soundOn=!soundOn; store('sound', soundOn?'on':'off'); syncSound(); blip(700); };

function sparkle(x,y,c){

    d.style.left=(x-8)+'px'; d.style.top=(y-8)+'px';
    const a=Math.random()*Math.PI*2, r=40+Math.random()*50;
    d.style.setProperty('--dx',Math.cos(a)*r+'px'); d.style.setProperty('--dy',Math.sin(a)*r+'px');
    document.body.appendChild(d); setTimeout(()=>d.remove(),650);
  }
}
let saveTimer;
function fillAt(cx, cy, col=current){
  const r = paper.getBoundingClientRect();
  const x = Math.floor((cx-r.left)/r.width*N), y = Math.floor((cy-r.top)/r.height*N);
  if (x<0||y<0||x>=N||y>=N) return;
  if (bucket(x,y,col==='rainbow'?'rainbow':toU32(col))){
    render(); updateUndo(); sparkle(cx,cy,col==='rainbow'?'#8338ec':col); blip(450+Math.random()*350);

}

/* ---------- zoom: pinch with two fingers, drag one finger to move ---------- */
const board = document.getElementById('board');
const zin = document.getElementById('zin'), zout = document.getElementById('zout');
let z = 1, tx = 0, ty = 0, baseS = 0;
function base(){ const r = board.getBoundingClientRect(); return { x: r.left+(r.width-baseS)/2, y: r.top+(r.height-baseS)/2 }; }
function clampView(){
  if (z <= 1.001){ z = 1; tx = 0; ty = 0; }
  else { const ex = baseS*0.25; tx = Math.min(ex, Math.max(baseS - z*baseS - ex, tx)); ty = Math.min(ex, Math.max(baseS - z*baseS - ex, ty)); }
  paper.style.transform = `translate(${tx}px,${ty}px) scale(${z})`;
  zout.disabled = z <= 1;
}
function zoomAt(mx, my, nz){
  const b = base(), px = (mx-b.x-tx)/z, py = (my-b.y-ty)/z;
  z = Math.min(6, Math.max(1, nz)); tx = mx-b.x-z*px; ty = my-b.y-z*py; clampView();
}
function boardCenter(){ const r = board.getBoundingClientRect(); return [r.left+r.width/2, r.top+r.height/2]; }
zin.onclick = () => { const [x,y] = boardCenter(); zoomAt(x, y, z*1.6); blip(760,0.1); };
zout.onclick = () => { const [x,y] = boardCenter(); zoomAt(x, y, z/1.6 < 1.15 ? 1 : z/1.6); blip(520,0.1); };

function dab(x0,y0,x1,y1){
  cctx.lineCap='round'; cctx.lineJoin='round';
  cctx.lineWidth = BRUSH[sizeIdx]*S*(tool==='eraser'?1.5:1);
  cctx.strokeStyle = tool==='eraser' ? '#ffffff' : (tool==='rainbow' || current==='rainbow') ? `hsl(${stroke.hue},95%,58%)` : current;
  cctx.beginPath(); cctx.moveTo(x0,y0); cctx.lineTo(x1+0.01,y1); cctx.stroke();

function eraseStickers(x,y){
  for (let i=stickers.length-1;i>=0;i--){ const s=stickers[i];
    if (Math.hypot(s.x*S-x, s.y*S-y) < s.size*S*0.45 + BRUSH[sizeIdx]*S*0.5){ stroke.dels.push({s,i}); stickers.splice(i,1); } }
}
function strokeStart(id,cx,cy){
  prev.set(col32); const [x,y]=toCanvas(cx,cy);
  stroke={id,x,y,cx,cy,hue:Math.random()*360,dels:[],pending:tool==='rainbow'};
  if (stroke.pending) return; // rainbow: a tap fills, a drag draws
  dab(x,y,x,y); if (tool==='eraser') eraseStickers(x,y); renderLive();
}
function strokeMove(cx,cy){
  if (stroke.pending){ if (Math.hypot(cx-stroke.cx,cy-stroke.cy) < 12) return; stroke.pending=false; dab(stroke.x,stroke.y,stroke.x,stroke.y); }
  const [x,y]=toCanvas(cx,cy), d=Math.hypot(x-stroke.x,y-stroke.y); if (d<2) return;
  if (tool==='rainbow' || current==='rainbow') stroke.hue=(stroke.hue+d*0.35)%360;
  dab(stroke.x,stroke.y,x,y); stroke.x=x; stroke.y=y; if (tool==='eraser') eraseStickers(x,y); renderLive();
}
function strokeEnd(){
  if (stroke.pending){ const {cx,cy}=stroke; stroke=null; fillAt(cx,cy,'rainbow'); return; }
  col32.set(new Uint32Array(cctx.getImageData(0,0,N,N).data.buffer));
  let n=0; for (let i=0;i<N*N;i++) if (col32[i]!==prev[i]) changed[n++]=i;
  if (n || stroke.dels.length){
    const idx=changed.slice(0,n), old=new Uint32Array(n); for (let k=0;k<n;k++) old[k]=prev[idx[k]];
    undoStack.push({t:'px', idx, old, dels:stroke.dels}); if (undoStack.length>25) undoStack.shift();
    updateUndo(); clearTimeout(saveTimer); saveTimer=setTimeout(saveNow,400);
  }
  stroke=null; render();
}
function strokeCancel(){
  col32.set(prev); for (let k=stroke.dels.length-1;k>=0;k--) stickers.splice(stroke.dels[k].i,0,stroke.dels[k].s);
  stroke=null; render();
}
function placeSticker(cx,cy){
  const [x,y]=toCanvas(cx,cy); if (x<0||y<0||x>=N||y>=N) return;
  stickers.push({e:currentSticker, x:x/S, y:y/S, size:STK[sizeIdx]});
  undoStack.push({t:'add'}); updateUndo(); render(); sparkle(cx,cy,'#ffd60a'); blip(980,0.15); saveNow();
}

const pts = new Map(); let tap = null, pinch = null, pan = null;
function twoPts(){ const [a,b] = [...pts.values()]; return { mx:(a.x+b.x)/2, my:(a.y+b.y)/2, d: Math.max(20, Math.hypot(a.x-b.x, a.y-b.y)) }; }
function startPinch(){ const p = twoPts(), b = base(); pinch = { d0:p.d, z0:z, px:(p.mx-b.x-tx)/z, py:(p.my-b.y-ty)/z }; }
board.addEventListener('pointerdown', e => {
  if (e.target.closest('.zoom')) return;
  e.preventDefault();
  try { board.setPointerCapture(e.pointerId); } catch(err){}
  pts.set(e.pointerId, { x:e.clientX, y:e.clientY });
  if (pts.size === 1){
    if (isBrush()){ tap = null; pan = null; strokeStart(e.pointerId, e.clientX, e.clientY); }
    else { tap = { id:e.pointerId, x:e.clientX, y:e.clientY }; pan = { x:e.clientX, y:e.clientY, tx, ty }; }
  }
  else if (pts.size === 2){ if (stroke) strokeCancel(); tap = null; pan = null; startPinch(); }
});
board.addEventListener('pointermove', e => {
  if (!pts.has(e.pointerId)) return;
  pts.set(e.pointerId, { x:e.clientX, y:e.clientY });
  if (pinch && pts.size >= 2){
    const p = twoPts(), b = base();
    z = Math.min(6, Math.max(1, pinch.z0 * p.d / pinch.d0));
    tx = p.mx - b.x - z*pinch.px; ty = p.my - b.y - z*pinch.py; clampView();
  } else if (stroke && pts.size === 1 && e.pointerId === stroke.id){
    strokeMove(e.clientX, e.clientY);
  } else if (pan && pts.size === 1){
    const dx = e.clientX-pan.x, dy = e.clientY-pan.y;
    if (tap && Math.hypot(dx,dy) > 14) tap = null;
    if (!tap && z > 1){ tx = pan.tx+dx; ty = pan.ty+dy; clampView(); }
  }
});
function endPointer(e){
  if (!pts.has(e.pointerId)) return;
  pts.delete(e.pointerId);
  if (stroke && stroke.id === e.pointerId) strokeEnd();
  if (e.type === 'pointerup' && tap && tap.id === e.pointerId){ if (tool==='sticker') placeSticker(tap.x, tap.y); else fillAt(tap.x, tap.y); }
  tap = null;
  if (pts.size < 2) pinch = null;
  if (pts.size === 1){ const p = [...pts.values()][0]; pan = { x:p.x, y:p.y, tx, ty }; }
  if (pts.size === 0) pan = null;
}
board.addEventListener('pointerup', endPointer);
board.addEventListener('pointercancel', endPointer);
board.addEventListener('wheel', e => { e.preventDefault(); zoomAt(e.clientX, e.clientY, z*(e.deltaY<0?1.15:1/1.15)); }, { passive:false });
function saveNow(){ store('sheet:'+sheet.id, colorC.toDataURL('image/png')); store('stk:'+sheet.id, JSON.stringify(stickers)); }

/* ---------- undo / start over ---------- */
const undoBtn = document.getElementById('undo');
function updateUndo(){ undoBtn.disabled = undoStack.length===0; }
undoBtn.onclick = () => {
  const u = undoStack.pop(); if (!u) return;
  if (u.t==='add') stickers.pop();
  else {
    for (let k=u.idx.length-1;k>=0;k--) col32[u.idx[k]] = u.old[k];
    if (u.dels) for (let k=u.dels.length-1;k>=0;k--) stickers.splice(u.dels[k].i,0,u.dels[k].s);
  }
  render(); updateUndo(); blip(300,0.15); saveNow();
};
const confirmBox = document.getElementById('confirm');
document.getElementById('clear').onclick = () => confirmBox.classList.add('open');
document.getElementById('no').onclick = () => confirmBox.classList.remove('open');
document.getElementById('yes').onclick = () => {
  confirmBox.classList.remove('open'); col32.fill(WHITE); stickers=[]; undoStack=[]; updateUndo(); render(); remove('sheet:'+sheet.id); remove('stk:'+sheet.id); blip(250,0.3);
};

/* ---------- picture picker ---------- */
const picker = document.getElementById('picker'), cards = document.getElementById('cards');
function showPicker(){
  cards.innerHTML='';
  const section = (title, list) => {
    const h=document.createElement('h3'); h.textContent=title; cards.appendChild(h);
    const g=document.createElement('div'); g.className='grid'; cards.appendChild(g);
    list.forEach(s => g.appendChild(makeCard(s)));
  };
  const monthName = new Date().toLocaleString('en-US',{month:'long'});
  section(`${MONTH.emoji} ${monthName}: ${MONTH.name}`, MONTH.sheets);
  section('⭐ Everyday pictures', SHEETS);
  MONTHS.filter(m=>m!==MONTH).forEach(m => section(`${m.emoji} ${m.name}`, m.sheets));
  picker.classList.add('open');
}
function makeCard(s){
  {
    const b=document.createElement('button'); b.className='card'+(s===sheet?' current':'');
    const cv=document.createElement('canvas'); cv.width=cv.height=300; const x=cv.getContext('2d');
    const paint=()=>{ drawLines(x,s,0.3); drawStickers(x, loadStickers(s.id), 0.3); };
    const saved=load('sheet:'+s.id);
    if (saved){ const im=new Image(); im.onload=()=>{x.drawImage(im,0,0,300,300); paint();}; im.src=saved; } else paint();
    b.append(cv, document.createTextNode(s.name));
    b.onclick=()=>{ picker.classList.remove('open'); openSheet(s); blip(660); };
    return b;
  }
}
document.getElementById('pics').onclick = showPicker;
picker.addEventListener('pointerdown', e => { if (e.target===picker) picker.classList.remove('open'); });

/* ---------- storage (safe if blocked) ---------- */
function store(k,v){ try{ localStorage.setItem('colorsplash:'+k,v); }catch(e){} }
function load(k){ try{ return localStorage.getItem('colorsplash:'+k); }catch(e){ return null; } }
function remove(k){ try{ localStorage.removeItem('colorsplash:'+k); }catch(e){} }

/* ---------- sizing ---------- */
function fit(){ const r=board.getBoundingClientRect(); const s=Math.max(200,Math.floor(Math.min(r.width,r.height)-14)); paper.style.width=s+'px'; paper.style.height=s+'px'; baseS=s; clampView(); }
new ResizeObserver(fit).observe(board); fit();
document.addEventListener('gesturestart', e => e.preventDefault());

document.getElementById('pics').textContent = MONTH.emoji + ' Pictures';

/* ---------- save picture to the iPad ---------- */
const toastEl = document.getElementById('toast'); let toastTimer;
function toast(msg){ toastEl.textContent=msg; toastEl.classList.add('show'); clearTimeout(toastTimer); toastTimer=setTimeout(()=>toastEl.classList.remove('show'),2200); }
const saveBtn = document.getElementById('savePic');
(async () => {
  let downloads = null;
  try { downloads = window.claude && await window.claude.use('downloads'); } catch(e){}
  if (!downloads) return;
  saveBtn.hidden = false;
  saveBtn.onclick = async () => {
    saveNow(); render();
    const out = document.createElement('canvas'); out.width = out.height = N;
    const o = out.getContext('2d'); o.fillStyle = '#fff'; o.fillRect(0,0,N,N); o.drawImage(paper,0,0);
    const blob = await new Promise(r => out.toBlob(r, 'image/png'));
    try { await downloads.save({ filename: `my-${sheet.id}-coloring.png`, data: blob }); toast('Saved! 🎉'); blip(1000,0.25); }
    catch(e){ if (e && e.code !== 'declined') toast('Saving didn’t work here. Your coloring is still kept in the game.'); }
  };
})();
openSheet(ALL.find(s=>s.id===load('last')) || MONTH.sheets[0]);
})();
</script>
