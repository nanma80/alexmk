<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alex's Games</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #f5f7fb;
            color: #243047;
            line-height: 1.5;
        }
        main {
            max-width: 640px;
            margin: 0 auto;
            padding: 56px 20px;
        }
        h1 { font-size: clamp(2rem, 7vw, 2.75rem); letter-spacing: -0.04em; }
        .subtitle { color: #59657a; font-size: 18px; margin: 8px 0 28px; }
        ul { list-style: none; display: grid; gap: 14px; }
        a {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            min-height: 84px;
            padding: 20px 24px;
            border: 1px solid #dce3ee;
            border-radius: 16px;
            background: #fff;
            color: #243047;
            text-decoration: none;
            box-shadow: 0 2px 6px #24304706;
        }
        a:hover { border-color: #9db6df; background: #fafdff; }
        a:focus-visible { outline: 3px solid #2563eb; outline-offset: 4px; }
        .name { display: block; font-size: 24px; font-weight: 650; }
        .note { display: block; margin-top: 4px; color: #59657a; font-size: 16px; }
        .arrow { color: #42659a; font-size: 24px; flex-shrink: 0; }
        @media (max-width: 480px) {
            main { padding: 32px 16px; }
            a { padding: 18px 20px; }
        }
    </style>
</head>
<body>
    <main>
        <h1>Alex's Games</h1>
        <p class="subtitle">A collection of games by Alex</p>
        <ul>
            <li><a href="color-splash/"><span class="name">Color Splash</span><span class="arrow" aria-hidden="true">&rarr;</span></a></li>
            <li><a href="paw-pals/"><span class="name">Paw Pals</span><span class="arrow" aria-hidden="true">&rarr;</span></a></li>
            <li><a href="calamity2d/"><span><span class="name">Calamity 2D</span><span class="note">(need keyboard and mouse)</span></span><span class="arrow" aria-hidden="true">&rarr;</span></a></li>
            <li><a href="portal2d/portal2d.html"><span><span class="name">Portal 2D</span><span class="note">(need keyboard and mouse)</span></span><span class="arrow" aria-hidden="true">&rarr;</span></a></li>
        </ul>
    </main>
</body>
</html>
